# Usage:
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull nomic-embed-text
#   docker compose exec ollama ollama pull qwen2.5:3b
#   docker compose run --rm api sh -c "python -m src.data.fetch_openfda && python -m src.data.fetch_pubmed \
#       && python -m src.ingest.chunk && python -m src.ingest.build_index"      # one-time, fills ./data
#   docker compose up -d            # API on :8000, UI on :8501
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # For an NVIDIA GPU (needs the NVIDIA Container Toolkit), uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: .
    depends_on: [ollama]
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  ui:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    depends_on: [ollama]
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"

volumes:
  ollama:
